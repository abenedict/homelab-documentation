# code-server (VS Code in the browser) on oracle1
# Deployed to: /home/ubuntu/stacks/code-server/compose.yaml
# Reached only via Tailscale: `tailscale serve` proxies https://oracle1.<tailnet>.ts.net -> 127.0.0.1:8080
services:
  code-server:
    image: codercom/code-server:latest
    container_name: code-server
    restart: unless-stopped
    user: "1001:1001"              # run as host user `ubuntu` so files in the docs repo stay owned by ubuntu
    environment:
      - DOCKER_USER=ubuntu
    ports:
      - "127.0.0.1:8080:8080"      # localhost only; never published to the internet
    volumes:
      - /home/ubuntu/homelab-docs:/home/coder/homelab-docs
      - ./data/config:/home/coder/.config     # code-server password lives in config/code-server/config.yaml
      - ./data/local:/home/coder/.local       # extensions + settings
    command: ["--bind-addr", "0.0.0.0:8080", "/home/coder/homelab-docs"]
